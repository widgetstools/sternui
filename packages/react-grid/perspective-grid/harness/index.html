<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>perspective-grid harness</title>
    <link rel="stylesheet" href="./harness.css" />
  </head>
  <body>
    <header>
      <h1>perspective-grid harness — Milestone 1</h1>
      <p class="sub">
        One SharedWorker holds the Perspective engine and a 20,000 &times; 52 mock book. Every
        window opened from here attaches to it over a ProxySession and reads only the rows its
        viewport asks for. The claim under test: the 2nd and 3rd blotter open as fast as the 1st.
      </p>
    </header>
    <main>
      <div class="bar">
        <button id="plumbing">1 · plumbing proof</button>
        <button id="one">2 · open one blotter</button>
        <button id="three">3 · open three blotters</button>
        <button id="status">host status</button>
      </div>
      <ol id="steps"></ol>
    </main>
    <script type="module">
      import { createHostHandle } from './hostClient.mjs';

      const steps = document.getElementById('steps');
      const line = (className, text) => {
        const li = document.createElement('li');
        li.className = className;
        li.textContent = text;
        steps.prepend(li);
      };

      // Windows are opened, not iframed: separate windows are what the desktop
      // actually does, and iframes would share this page's main thread.
      const openBlotter = (index) =>
        window.open(
          './blotter.html',
          `blotter-${index}-${Date.now()}`,
          'width=1280,height=760,noopener=no',
        );

      document.getElementById('plumbing').onclick = () => window.open('./plumbing.html', '_blank');

      document.getElementById('one').onclick = () => {
        const at = performance.now();
        openBlotter(1);
        line('ok', `opened 1 blotter at ${at.toFixed(0)}ms — read its own "first rows" timing.`);
      };

      document.getElementById('three').onclick = () => {
        for (let i = 1; i <= 3; i++) openBlotter(i);
        line(
          'ok',
          'opened 3 blotters in one gesture. Each reports its own time-to-first-rows; ' +
            'the host boot cost is paid once, by whichever window got there first.',
        );
      };

      const host = createHostHandle();
      host.onMessage((message) => {
        if (message.type === 'status') {
          const t = message.timings;
          line(
            'ok',
            `host — ${message.rows.toLocaleString()} rows, ${message.attached} window(s) attached; ` +
              `boot: engine ${t.clientMs.toFixed(0)}ms, table ${t.tableMs.toFixed(0)}ms, ` +
              `generate ${t.generateMs.toFixed(0)}ms, load ${t.loadMs.toFixed(0)}ms.`,
          );
        } else if (message.type === 'error') {
          line('bad', `host error — ${message.detail}`);
        }
      });

      document.getElementById('status').onclick = () => host.send({ cmd: 'status' });
    </script>
  </body>
</html>
